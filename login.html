<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邮箱登录 | 广西大学众创空间 · AI与机器人协会招新</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔐%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="nav-logo-dot"></span>
        <span>GZU · 众创空间 | AI&amp;机器人协会</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html#about">协会简介</a></li>
        <li><a href="index.html#honors">荣誉竞赛</a></li>
        <li><a href="register.html">报名</a></li>
        <li><a href="login.html" class="active">登录</a></li>
      </ul>
    </div>
  </nav>

  <main class="form-page">
    <div class="form-card" id="login-card">
      <h1>🔐 邮箱登录</h1>
      <p class="form-sub">
        新生可登录后查看报名审批状态，管理员可登录后进入审批后台。
      </p>

      <div id="alert" class="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">邮箱 <span class="req">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="your@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">密码 <span class="req">*</span></label>
          <input type="password" id="password" class="form-control" placeholder="至少 6 位" required minlength="6" autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-submit" id="submit-btn">
          登录
        </button>
      </form>

      <div class="form-footer">
        <p>还没有账号？<a href="register.html">去报名 →</a></p>
        <p style="margin-top:8px;">忘记密码？<a href="#" id="forgot-link">点击找回 →</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 广西大学众创空间 · 人工智能与机器人协会</p>
  </footer>

  <script type="module" src="js/supabase-init.js"></script>
  <script type="module" src="js/auth.login.js"></script>
</body>
</html>
