<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员审批后台 | 广西大学众创空间 · AI与机器人协会</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛡️%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="nav-logo-dot"></span>
        <span>GZU · 众创空间 | 管理后台</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">返回首页</a></li>
      </ul>
      <div id="nav-user" class="nav-user" style="display:none;">
        <span class="user-email" id="user-email"></span>
        <button class="btn-logout" id="btn-logout">退出登录</button>
      </div>
    </div>
  </nav>

  <main class="admin-page">

    <!-- 未登录提示 -->
    <div id="login-required" style="display:none;text-align:center;padding:120px 20px;">
      <div style="font-size:4rem;margin-bottom:20px;">🔐</div>
      <h2 style="margin-bottom:12px;">请先登录管理员账号</h2>
      <p style="color:var(--text-secondary);margin-bottom:24px;">本页面仅限管理员访问</p>
      <a href="login.html" class="btn btn-primary">前往登录 →</a>
    </div>

    <!-- 无权限提示 -->
    <div id="permission-denied" style="display:none;text-align:center;padding:120px 20px;">
      <div style="font-size:4rem;margin-bottom:20px;">🚫</div>
      <h2 style="margin-bottom:12px;color:var(--danger);">权限不足</h2>
      <p style="color:var(--text-secondary);margin-bottom:12px;">您的账号不是管理员，无法访问审批后台。</p>
      <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:24px;">
        如需查询您的报名状态，请前往：<a href="login.html" style="color:var(--accent-cyan);">登录 → 我的报名</a>
      </p>
      <button class="btn btn-outline" id="btn-as-user">返回首页</button>
    </div>

    <!-- 管理面板 -->
    <div id="admin-panel" style="display:none;">

      <div class="admin-header">
        <h1>🛡️ 新生报名 · 审批后台</h1>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-outline" id="btn-export">📥 导出 CSV</button>
          <button class="btn btn-outline" id="btn-refresh">🔄 刷新</button>
        </div>
      </div>

      <!-- 统计卡片 -->
      <div class="admin-stats">
        <div class="stat-card total">
          <div class="label">报名总数</div>
          <div class="num" id="stat-total">0</div>
        </div>
        <div class="stat-card pending">
          <div class="label">待审批</div>
          <div class="num" id="stat-pending">0</div>
        </div>
        <div class="stat-card approved">
          <div class="label">已通过</div>
          <div class="num" id="stat-approved">0</div>
        </div>
        <div class="stat-card rejected">
          <div class="label">已拒绝</div>
          <div class="num" id="stat-rejected">0</div>
        </div>
      </div>

      <!-- 筛选 -->
      <div class="filter-bar">
        <div class="form-group">
          <label>状态筛选</label>
          <select id="filter-status" class="form-control">
            <option value="">全部状态</option>
            <option value="pending" selected>待审批</option>
            <option value="approved">已通过</option>
            <option value="rejected">已拒绝</option>
          </select>
        </div>
        <div class="form-group">
          <label>意向方向</label>
          <select id="filter-dept" class="form-control">
            <option value="">全部方向</option>
            <option value="机器人研发">🤖 机器人研发</option>
            <option value="人工智能">🧠 人工智能</option>
            <option value="虚拟现实VR">🥽 虚拟现实 VR</option>
            <option value="人机交互HCI">🖐️ 人机交互 HCI</option>
            <option value="机械臂开发">🦾 机械臂开发</option>
            <option value="暂不确定">🌱 暂不确定</option>
          </select>
        </div>
        <div class="form-group">
          <label>搜索（姓名 / 学号 / 邮箱）</label>
          <input type="text" id="filter-search" class="form-control" placeholder="输入关键词..." />
        </div>
      </div>

      <!-- 列表 -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>学号</th>
              <th>学院 / 专业</th>
              <th>年级</th>
              <th>第一志愿</th>
              <th>手机</th>
              <th>邮箱</th>
              <th>状态</th>
              <th>报名时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="registrations-body">
            <tr><td colspan="10" class="empty">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 详情 Modal -->
  <div class="modal-mask" id="detail-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>📋 报名详情</h3>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body" id="detail-body">
        <!-- 动态注入 -->
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2025 广西大学众创空间 · 人工智能与机器人协会 · 管理员审批系统</p>
  </footer>

  <script type="module" src="js/supabase-init.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
